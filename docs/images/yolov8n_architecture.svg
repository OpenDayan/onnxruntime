<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1500" viewBox="0 0 2600 1500" role="img" aria-labelledby="title desc">
  <title id="title">YOLOv8n 网络结构</title>
  <desc id="desc">YOLOv8n 的 Backbone、Neck、Detect，以及 Conv、Bottleneck、C2f、SPPF 和 Detect 的主要内部结构。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#202020"/></marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#173d70"/></marker>
    <style>
      text { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #161616; }
      .title { font-size: 36px; font-weight: 700; text-anchor: middle; }
      .section { font-size: 27px; font-weight: 700; text-anchor: middle; }
      .panel-title { font-size: 24px; font-weight: 700; text-anchor: middle; }
      .label { font-size: 18px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
      .small { font-size: 15px; font-weight: 500; text-anchor: middle; dominant-baseline: middle; }
      .note { font-size: 16px; font-weight: 500; fill: #404040; }
      .group { fill: #fff; stroke: #222; stroke-width: 2.5; stroke-dasharray: 12 9; }
      .detail-group { fill: #fff; stroke: #173d70; stroke-width: 2.5; stroke-dasharray: 10 7; }
      .node { stroke: #222; stroke-width: 2.1; rx: 6; }
      .op { fill: #ffdc73; }
      .composite { fill: #f5a05a; }
      .resize { fill: #c85d50; }
      .pool { fill: #d8d8d8; }
      .merge { fill: #b7add9; }
      .control { fill: #cbd7e7; }
      .output { fill: #83c95b; }
      .flow { fill: none; stroke: #202020; stroke-width: 2.4; marker-end: url(#arrow); }
      .skip { fill: none; stroke: #202020; stroke-width: 2.0; marker-end: url(#arrow); }
      .wire { fill: none; stroke: #202020; stroke-width: 2.2; }
      .detail-flow { fill: none; stroke: #173d70; stroke-width: 2.2; marker-end: url(#blue-arrow); }
      .detail-skip { fill: none; stroke: #173d70; stroke-width: 1.9; marker-end: url(#blue-arrow); }
      .detail-wire { fill: none; stroke: #173d70; stroke-width: 1.9; }
      .junction { fill: #173d70; }
    </style>
  </defs>

  <rect width="2600" height="1500" fill="#fff"/>
  <text class="title" x="1300" y="45">YOLOv8n 网络结构</text>

  <!-- 左侧：实际网络结构 -->
  <rect class="group" x="30" y="70" width="300" height="1360"/>
  <rect class="group" x="350" y="70" width="500" height="1360"/>
  <rect class="group" x="870" y="70" width="300" height="1360"/>

  <!-- Backbone -->
  <text class="small" x="180" y="95">输入 [1,3,640,640]</text>
  <rect class="node op" x="70" y="115" width="220" height="58"/><text class="label" x="180" y="137">Conv</text><text class="small" x="180" y="158">[16,320,320]</text>
  <rect class="node op" x="70" y="205" width="220" height="58"/><text class="label" x="180" y="227">Conv</text><text class="small" x="180" y="248">[32,160,160]</text>
  <rect class="node composite" x="70" y="295" width="220" height="58"/><text class="label" x="180" y="317">C2f（n=1）</text><text class="small" x="180" y="339">[32,160,160]</text>
  <rect class="node op" x="70" y="385" width="220" height="58"/><text class="label" x="180" y="407">Conv</text><text class="small" x="180" y="428">[64,80,80]</text>
  <rect class="node composite" x="70" y="475" width="220" height="58"/><text class="label" x="180" y="497">C2f（n=2）</text><text class="small" x="180" y="519">P3 [64,80,80]</text>
  <rect class="node op" x="70" y="565" width="220" height="58"/><text class="label" x="180" y="587">Conv</text><text class="small" x="180" y="608">[128,40,40]</text>
  <rect class="node composite" x="70" y="655" width="220" height="58"/><text class="label" x="180" y="677">C2f（n=2）</text><text class="small" x="180" y="699">P4 [128,40,40]</text>
  <rect class="node op" x="70" y="745" width="220" height="58"/><text class="label" x="180" y="767">Conv</text><text class="small" x="180" y="788">[256,20,20]</text>
  <rect class="node composite" x="70" y="835" width="220" height="58"/><text class="label" x="180" y="857">C2f（n=1）</text><text class="small" x="180" y="879">[256,20,20]</text>
  <rect class="node composite" x="70" y="925" width="220" height="58"/><text class="label" x="180" y="947">SPPF</text><text class="small" x="180" y="969">P5 [256,20,20]</text>
  <path class="flow" d="M180 173 V205"/><path class="flow" d="M180 263 V295"/><path class="flow" d="M180 353 V385"/><path class="flow" d="M180 443 V475"/><path class="flow" d="M180 533 V565"/><path class="flow" d="M180 623 V655"/><path class="flow" d="M180 713 V745"/><path class="flow" d="M180 803 V835"/><path class="flow" d="M180 893 V925"/>

  <!-- Neck：自顶向下 -->
  <rect class="node composite" x="390" y="205" width="190" height="58"/><text class="label" x="485" y="227">C2f（P3）</text><text class="small" x="485" y="249">[64,80,80]</text>
  <rect class="node op" x="390" y="315" width="190" height="58"/><text class="label" x="485" y="344">Concat</text>
  <rect class="node resize" x="390" y="425" width="190" height="58"/><text class="label" x="485" y="454">Resize ×2</text>
  <rect class="node composite" x="390" y="555" width="190" height="58"/><text class="label" x="485" y="577">C2f</text><text class="small" x="485" y="599">[128,40,40]</text>
  <rect class="node op" x="390" y="665" width="190" height="58"/><text class="label" x="485" y="694">Concat</text>
  <rect class="node resize" x="390" y="775" width="190" height="58"/><text class="label" x="485" y="804">Resize ×2</text>
  <path class="flow" d="M485 775 V723"/><path class="flow" d="M485 665 V613"/><path class="flow" d="M485 555 V483"/><path class="flow" d="M485 425 V373"/><path class="flow" d="M485 315 V263"/>
  <path class="flow" d="M290 954 H365 V804 H390"/><path class="skip" d="M290 684 H350 V694 H390"/><path class="skip" d="M290 504 H350 V344 H390"/>

  <!-- Neck：自底向上 PAN -->
  <rect class="node op" x="630" y="315" width="180" height="58"/><text class="label" x="720" y="337">Conv</text><text class="small" x="720" y="358">stride=2</text>
  <rect class="node op" x="630" y="445" width="180" height="58"/><text class="label" x="720" y="474">Concat</text>
  <rect class="node composite" x="630" y="555" width="180" height="58"/><text class="label" x="720" y="577">C2f（P4）</text><text class="small" x="720" y="599">[128,40,40]</text>
  <rect class="node op" x="630" y="685" width="180" height="58"/><text class="label" x="720" y="707">Conv</text><text class="small" x="720" y="728">stride=2</text>
  <rect class="node op" x="630" y="815" width="180" height="58"/><text class="label" x="720" y="844">Concat</text>
  <rect class="node composite" x="630" y="925" width="180" height="58"/><text class="label" x="720" y="947">C2f（P5）</text><text class="small" x="720" y="969">[256,20,20]</text>
  <path class="flow" d="M580 234 H610 V344 H630"/><path class="flow" d="M720 373 V445"/><path class="flow" d="M720 503 V555"/><path class="flow" d="M720 613 V685"/><path class="flow" d="M720 743 V815"/><path class="flow" d="M720 873 V925"/>
  <path class="skip" d="M580 584 H600 V474 H630"/><path class="skip" d="M290 954 H600 V844 H630"/>

  <!-- Detect 和官方后处理。实际模型只有一个 model.22 Detect，接收 P3/P4/P5。 -->
  <rect class="node op" x="910" y="205" width="220" height="74"/><text class="label" x="1020" y="226">P3 特征输入</text><text class="small" x="1020" y="250">[64,80,80]</text>
  <rect class="node op" x="910" y="547" width="220" height="74"/><text class="label" x="1020" y="568">P4 特征输入</text><text class="small" x="1020" y="592">[128,40,40]</text>
  <rect class="node op" x="910" y="917" width="220" height="74"/><text class="label" x="1020" y="938">P5 特征输入</text><text class="small" x="1020" y="962">[256,20,20]</text>
  <path class="flow" d="M580 234 H910"/><path class="flow" d="M810 584 H910"/><path class="flow" d="M810 954 H910"/>

  <rect class="node composite" x="910" y="1030" width="220" height="96"/>
  <text class="label" x="1020" y="1052">Detect</text>
  <text class="small" x="1020" y="1077">三尺度回归与分类</text>
  <text class="small" x="1020" y="1101">DFL 与边框解码</text>
  <path class="wire" d="M1130 242 H1150"/>
  <path class="wire" d="M1130 584 H1150"/>
  <path class="wire" d="M1130 954 H1150"/>
  <path class="wire" d="M1150 242 V1078"/>
  <path class="flow" d="M1150 1078 H1130"/>

  <rect class="node output" x="910" y="1150" width="220" height="58"/><text class="small" x="1020" y="1172">主网络输出</text><text class="label" x="1020" y="1193">[1,84,8400]</text><path class="flow" d="M1020 1126 V1150"/>
  <rect class="node control" x="895" y="1245" width="250" height="92"/><text class="label" x="1020" y="1272">后处理</text><text class="small" x="1020" y="1308">筛选 / NMS / 输出打包</text><path class="flow" d="M1020 1208 V1245"/>
  <text class="small" x="1020" y="1380">最终输出 [1,300,6]</text>
  <text class="section" x="180" y="1408">主干网络</text><text class="section" x="600" y="1408">特征融合网络</text><text class="section" x="1020" y="1408">检测头与后处理</text>

  <!-- Conv -->
  <rect class="detail-group" x="1210" y="70" width="620" height="270"/>
  <text class="panel-title" x="1520" y="105">Conv</text>
  <rect class="node output" x="1280" y="165" width="170" height="58"/><text class="label" x="1365" y="194">Conv2D</text>
  <rect class="node op" x="1580" y="165" width="170" height="58"/><text class="label" x="1665" y="194">SiLU</text>
  <path class="detail-flow" d="M1450 194 H1580"/>

  <!-- Bottleneck -->
  <rect class="detail-group" x="1210" y="365" width="620" height="305"/>
  <text class="panel-title" x="1520" y="400">Bottleneck</text>
  <text class="small" x="1260" y="505">输入</text>
  <rect class="node op" x="1310" y="475" width="140" height="58"/><text class="label" x="1380" y="504">Conv</text>
  <rect class="node op" x="1510" y="475" width="140" height="58"/><text class="label" x="1580" y="504">Conv</text>
  <rect class="node composite" x="1700" y="475" width="100" height="58"/><text class="label" x="1750" y="493">Add</text><text class="small" x="1750" y="516">shortcut</text>
  <path class="detail-wire" d="M1280 504 H1295"/><circle class="junction" cx="1295" cy="504" r="4"/><path class="detail-flow" d="M1295 504 H1310"/><path class="detail-flow" d="M1450 504 H1510"/><path class="detail-flow" d="M1650 504 H1700"/>
  <path class="detail-skip" d="M1295 504 V450 H1750 V475"/>
  <path class="detail-flow" d="M1800 504 H1818"/>

  <!-- C2f -->
  <rect class="detail-group" x="1860" y="70" width="700" height="600"/>
  <text class="panel-title" x="2210" y="105">C2f</text>
  <rect class="node op" x="2160" y="145" width="170" height="55"/><text class="label" x="2245" y="173">Conv</text>
  <rect class="node composite" x="2160" y="245" width="170" height="55"/><text class="label" x="2245" y="273">Split</text>
  <path class="detail-flow" d="M2245 200 V245"/>

  <rect class="node composite" x="2350" y="350" width="160" height="58"/><text class="label" x="2430" y="371">Bottleneck × n</text><text class="small" x="2430" y="393">各级输出保留</text>
  <path class="detail-flow" d="M2330 273 H2430 V350"/>

  <rect class="node op" x="2160" y="460" width="170" height="55"/><text class="label" x="2245" y="488">Concat</text>
  <path class="detail-skip" d="M2160 273 H2045 V488 H2160"/>
  <path class="detail-flow" d="M2430 408 V435 H2245 V460"/>

  <rect class="node op" x="2160" y="555" width="170" height="55"/><text class="label" x="2245" y="583">Conv</text>
  <path class="detail-flow" d="M2245 515 V555"/>

  <!-- SPPF -->
  <rect class="detail-group" x="1210" y="705" width="1350" height="300"/><text class="panel-title" x="1885" y="740">SPPF</text>
  <rect class="node op" x="1280" y="800" width="130" height="55"/><text class="label" x="1345" y="828">Conv</text>
  <rect class="node pool" x="1500" y="800" width="135" height="55"/><text class="label" x="1568" y="828">MaxPool</text>
  <rect class="node pool" x="1710" y="800" width="135" height="55"/><text class="label" x="1778" y="828">MaxPool</text>
  <rect class="node pool" x="1920" y="800" width="135" height="55"/><text class="label" x="1988" y="828">MaxPool</text>
  <rect class="node merge" x="2130" y="785" width="145" height="85"/><text class="label" x="2203" y="828">Concat</text>
  <rect class="node op" x="2360" y="800" width="130" height="55"/><text class="label" x="2425" y="828">Conv</text>
  <path class="detail-flow" d="M1410 828 H1500"/><path class="detail-flow" d="M1635 828 H1710"/><path class="detail-flow" d="M1845 828 H1920"/><path class="detail-flow" d="M2055 828 H2130"/><path class="detail-flow" d="M2275 828 H2360"/>
  <circle class="junction" cx="1455" cy="828" r="4"/><circle class="junction" cx="1673" cy="828" r="4"/><circle class="junction" cx="1883" cy="828" r="4"/>
  <path class="detail-wire" d="M1455 828 V920 H2203"/>
  <path class="detail-wire" d="M1673 828 V905 H2203"/>
  <path class="detail-wire" d="M1883 828 V890 H2203"/>
  <path class="detail-flow" d="M2203 920 V870"/>

  <!-- Detect 与 DFL -->
  <rect class="detail-group" x="1210" y="1035" width="1350" height="395"/><text class="panel-title" x="1885" y="1070">Detect</text>
  <rect class="node composite" x="1250" y="1120" width="150" height="55"/><text class="label" x="1325" y="1148">P3 / P4 / P5</text>
  <rect class="node op" x="1460" y="1100" width="320" height="72"/><text class="small" x="1620" y="1123">边框回归</text><text class="small" x="1620" y="1148">Conv ×2 → Conv → Reshape</text>
  <rect class="node op" x="1460" y="1200" width="320" height="72"/><text class="small" x="1620" y="1223">类别预测</text><text class="small" x="1620" y="1248">Conv ×2 → Conv → Reshape</text>
  <path class="detail-wire" d="M1400 1148 H1430"/><circle class="junction" cx="1430" cy="1148" r="4"/><path class="detail-flow" d="M1430 1148 V1136 H1460"/><path class="detail-flow" d="M1430 1148 V1236 H1460"/>
  <rect class="node op" x="1840" y="1100" width="150" height="72"/><text class="small" x="1915" y="1123">Concat</text><text class="small" x="1915" y="1148">三尺度回归</text><rect class="node op" x="1840" y="1200" width="150" height="72"/><text class="small" x="1915" y="1223">Concat</text><text class="small" x="1915" y="1248">三尺度分类</text>
  <path class="detail-flow" d="M1780 1136 H1840"/><path class="detail-flow" d="M1780 1236 H1840"/>
  <rect class="node merge" x="2050" y="1090" width="300" height="92"/><text class="label" x="2200" y="1118">DFL</text><text class="small" x="2200" y="1148">Reshape → Transpose → Softmax</text><text class="small" x="2200" y="1168">Conv → Reshape</text><path class="detail-flow" d="M1990 1136 H2050"/>
  <rect class="node op" x="2070" y="1210" width="130" height="55"/><text class="label" x="2135" y="1238">Sigmoid</text><path class="detail-flow" d="M1990 1236 H2070"/>
  <rect class="node control" x="2050" y="1310" width="300" height="70"/><text class="label" x="2200" y="1333">边框解码</text><text class="small" x="2200" y="1358">Slice / Mul / Sub / Add / Concat</text><path class="detail-flow" d="M2200 1182 V1310"/>
  <rect class="node output" x="2390" y="1185" width="135" height="95"/><text class="small" x="2458" y="1212">Concat</text><text class="small" x="2458" y="1235">[1,84,8400]</text><path class="detail-flow" d="M2350 1345 H2370 V1233 H2390"/><path class="detail-flow" d="M2200 1238 H2390"/>
</svg>
